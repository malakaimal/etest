<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrator Login | ETest</title><link rel="stylesheet" href="assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script></head><body class="auth-page"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">E</span><span>ETEST <small>ADMINISTRATION</small></span></a></header><main class="auth-layout" style="max-width:620px;grid-template-columns:1fr"><section class="auth-card"><span class="eyebrow">RESTRICTED AREA</span><h2>Administrator sign in</h2><p class="muted">Use the administrator account created securely in Supabase. Student credentials do not grant admin access.</p><form id="admin-login" class="stack"><label>Admin email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="btn primary full">Open admin dashboard →</button><p class="form-message" id="message"></p></form></section></main><script>const c=window.ETEST_CONFIG,ok=c&&c.SUPABASE_URL.startsWith('https://')&&window.supabase;document.querySelector('#admin-login').addEventListener('submit',async e=>{e.preventDefault();const m=document.querySelector('#message');if(!ok){m.textContent='Configure Supabase in assets/config.js first.';return}const f=new FormData(e.currentTarget),db=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);const {error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){m.textContent=error.message;return}const {data:{user}}=await db.auth.getUser(),{data:p}=await db.from('profiles').select('role').eq('id',user.id).maybeSingle();if(p?.role!=='admin'){await db.auth.signOut();m.textContent='This account does not have administrator permission.';return}location.href='admin.html'});</script></body></html>
