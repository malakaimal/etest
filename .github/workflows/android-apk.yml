name: Build ILM ETest Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Prepare student download
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ilm-etest.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ILM-ETest-Android-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ILM ETest Android v1.0.${{ github.run_number }}
          make_latest: true
          files: app/build/outputs/apk/debug/ilm-etest.apk
