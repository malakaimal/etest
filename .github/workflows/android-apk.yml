name: Build ILM ETest Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Prepare and verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" app/build/outputs/apk/debug/ilm-etest.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/ilm-etest.apk
          "$BUILD_TOOLS/aapt" dump badging app/build/outputs/apk/debug/ilm-etest.apk | head -n 5
      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ILM-ETest-Android-Verified
          path: app/build/outputs/apk/debug/ilm-etest.apk
          if-no-files-found: error
      - name: Publish verified APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ILM ETest Android v1.0.${{ github.run_number }}
          make_latest: true
          files: app/build/outputs/apk/debug/ilm-etest.apk
