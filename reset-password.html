<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b55"><title>Reset Password | ETest</title><link rel="stylesheet" href="assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script></head>
<body class="auth-page"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">E</span><span>ETEST <small>BY ILM</small></span></a></header>
<main class="auth-layout" style="max-width:620px;grid-template-columns:1fr"><section class="auth-card"><span class="eyebrow">SECURE ACCOUNT RECOVERY</span><h2>Choose a new password</h2><p class="muted">Open this page using the password-reset link sent to your email. Choose a password you have not used elsewhere.</p><form id="reset-form" class="stack" hidden><label>New password<input name="password" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters"></label><label>Confirm new password<input name="confirm" type="password" minlength="8" autocomplete="new-password" required placeholder="Enter it again"></label><button class="btn primary full" type="submit">Save new password →</button></form><p class="form-message" id="message" role="status">Checking your secure recovery link…</p><p class="auth-foot"><a href="index.html">Student login</a> · <a href="admin-login.html">Admin login</a></p></section></main>
<script>
const c=window.ETEST_CONFIG,db=window.supabase&&c?window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY):null;
const form=document.querySelector('#reset-form'),message=document.querySelector('#message');
async function checkSession(){if(!db){message.textContent='Supabase is not configured. Please contact ILM.';return}const {data,error}=await db.auth.getSession();if(error||!data.session){message.textContent='This recovery link is invalid or expired. Please request a new password-reset email.';return}form.hidden=false;message.textContent='Recovery link verified. Enter your new password.'}
db?.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session){form.hidden=false;message.textContent='Recovery link verified. Enter your new password.'}});
checkSession();
form.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(form),password=f.get('password');if(password!==f.get('confirm')){message.textContent='The passwords do not match.';return}if(password.length<8){message.textContent='Use at least 8 characters.';return}message.textContent='Updating password…';const {error}=await db.auth.updateUser({password});if(error){message.textContent=error.message;return}form.hidden=true;message.textContent='Password updated successfully. You can now sign in with your new password.';await db.auth.signOut();});
</script></body></html>
