<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b55"><title>Forgot Password | ETest</title><link rel="stylesheet" href="assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script></head>
<body class="auth-page"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">E</span><span>ETEST <small>BY ILM</small></span></a></header>
<main class="auth-layout" style="max-width:620px;grid-template-columns:1fr"><section class="auth-card"><span class="eyebrow">ACCOUNT RECOVERY</span><h2>Forgot your password?</h2><p class="muted">Enter the email address registered with your ETest account. We will send you a secure password-reset link.</p><form id="forgot-form" class="stack"><label>Email address<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><button class="btn primary full" type="submit">Send reset link →</button><p class="form-message" id="message" role="status"></p></form><p class="auth-foot"><a href="index.html">Back to student login</a> · <a href="admin-login.html">Admin login</a></p></section></main>
<script>
const c=window.ETEST_CONFIG,db=window.supabase&&c?window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY):null;
document.querySelector('#forgot-form').addEventListener('submit',async e=>{e.preventDefault();const m=document.querySelector('#message');if(!db){m.textContent='Supabase is not configured. Please contact ILM.';return}const email=new FormData(e.currentTarget).get('email').trim();m.textContent='Sending recovery email…';const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:'https://malakaimal.github.io/etest/reset-password.html'});m.textContent=error?error.message:'If this email is registered, a password-reset link has been sent. Please check your inbox and spam folder.';});
</script></body></html>
